[project]
name = "stock-invoice-backend"
version = "0.1.0"
description = "Stock & Invoice Assistant backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.2",
    "google-genai>=2.17.0",
    "groq>=1.6.0",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.5",
    "uvicorn[standard]>=0.51.0",
    "xhtml2pdf>=0.2.17",
]

[project.optional-dependencies]
db = []        # Postgres upgrade (deferred): sqlalchemy, alembic, psycopg2-binary
# WeasyPrint needs native Pango/GObject libraries not present on stock Windows
# (see app/services/invoice_renderers/base.py); xhtml2pdf is the default
# renderer instead. Add this extra + a WeasyPrintInvoiceRenderer once those
# native libs are installed, and switch INVOICE_RENDERER=weasyprint.
weasyprint = []

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
]
